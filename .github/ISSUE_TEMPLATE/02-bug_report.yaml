---
name: 🐛 Bug Report
description: Report a reproducible bug in the current stable release
labels: ["type: bug", "status: needs triage"]
body:
  - type: input
    attributes:
      label: Plugin Version
      description: What version of the plugin are you currently running?
    validations:
      required: true
  - type: input
    attributes:
      label: NetBox Version
      description: What version of NetBox are you currently running?
    validations:
      required: true
  - type: input
    attributes:
      label: Python Version
      description: What version of Python are you currently running?
    validations:
      required: true
  - type: input
    attributes:
      label: Browser
      description: >
        Which browser and version? The floorplan editor is a canvas application, so
        rendering and interaction problems are often browser-specific.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: >
        Describe in detail the exact steps that someone else can take to reproduce this bug.
        A numbered list of discrete steps is strongly preferred. Remember to capture the
        creation of any objects which must exist to reproduce the behavior, including the
        site or location the floorplan is assigned to and any rack types involved.
      placeholder: |
        1. Create a site named "Site 1" with a rack "rack-1"
        2. Open the site's Floor Plan tab and click Add
        3. Place the rack on the canvas and save
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The rack should appear on the floorplan at its configured dimensions
    validations:
      required: true
  - type: textarea
    attributes:
      label: Observed Behavior
      description: >
        What happened instead? Include any error messages, and any errors reported in the
        browser's developer console.
      placeholder: The rack was drawn at a default size and the console reported a TypeError
    validations:
      required: true
